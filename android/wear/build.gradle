plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.skoorbydna.rideweather.watch'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.skoorbydna.rideweather'
        minSdk 30
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1)
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            storeFile file('../app/rideweather.jks')
            storePassword 'rideweather'
            keyAlias 'rideweather'
            keyPassword 'rideweather'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.protolayout:protolayout:1.2.1'
    implementation 'com.google.guava:guava:33.3.1-android'
}
